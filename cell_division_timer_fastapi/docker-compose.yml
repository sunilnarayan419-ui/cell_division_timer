version: '3.8'

services:
  api:
    build: .
    container_name: cell_division_api
    ports:
      - "8000:8000"
    env_file:
      # Local secrets (NCBI_API_KEY, NCBI_EMAIL, etc.) are loaded from here.
      # Copy .env.example to .env and fill in your own values before running.
      - .env
    environment:
      - APP_NAME=Cell Division Timer API
      - APP_ENV=production
      - DEBUG=False
      - API_PREFIX=/api/v1
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/cell_division_db
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  db:
    image: postgres:16-alpine
    container_name: cell_division_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cell_division_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cell_division_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
